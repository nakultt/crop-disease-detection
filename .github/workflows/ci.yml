name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training:
    name: Training pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: training/uv.lock

      - name: Install
        # This installs the CUDA torch build (~2.5 GB), because pyproject.toml
        # pins the cu124 index and `--locked` installs exactly what uv.lock
        # resolved. It works on a CPU runner -- torch falls back to CPU at
        # runtime -- but it is the slowest step here by a wide margin.
        #
        # Note that `--extra-index-url .../cpu` does NOT fix this: it adds an
        # index rather than replacing the CUDA one. If CI time becomes a
        # problem, drop the `[tool.uv] extra-index-url` pin from
        # pyproject.toml and select the backend per machine instead with
        # `uv sync --torch-backend=auto`.
        run: uv sync --locked

      - name: Test
        # Covers the CAM identity, the ONNX round-trip, manifest completeness
        # against the live graph, and the deployment size budget. A failure in
        # test_cam_identity_survives_export means every heatmap the apps render
        # is fiction, so this gate is not advisory.
        run: uv run pytest -q

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    services:
      # Backs the integration tests and the end-to-end suite.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/plantguard_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pc/package-lock.json

      - run: npm ci

      - name: Lint and format check
        run: npx @biomejs/biome check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and integration tests
        # Unit tests cover the CAM maths, manifest validation, env parsing,
        # uploads, CSV and i18n completeness; the integration tests run the
        # scan store against the MongoDB service above.
        run: npx vitest run

      - name: Build
        run: npx next build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # Sign-up, email verification, an on-device scan with the committed
        # model, history, settings, password reset and account deletion,
        # against the production build.
        run: npx playwright test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/plantguard_e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pc/playwright-report
          retention-days: 7

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
