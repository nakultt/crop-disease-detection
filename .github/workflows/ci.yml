name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training:
    name: Training pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: training/uv.lock

      - name: Install
        # This installs the CUDA torch build (~2.5 GB), because pyproject.toml
        # pins the cu124 index and `--locked` installs exactly what uv.lock
        # resolved. It works on a CPU runner -- torch falls back to CPU at
        # runtime -- but it is the slowest step here by a wide margin.
        #
        # Note that `--extra-index-url .../cpu` does NOT fix this: it adds an
        # index rather than replacing the CUDA one. If CI time becomes a
        # problem, drop the `[tool.uv] extra-index-url` pin from
        # pyproject.toml and select the backend per machine instead with
        # `uv sync --torch-backend=auto`.
        run: uv sync --locked

      - name: Test
        # Covers the CAM identity, the ONNX round-trip, manifest completeness
        # against the live graph, and the deployment size budget. A failure in
        # test_cam_identity_survives_export means every heatmap the apps render
        # is fiction, so this gate is not advisory.
        run: uv run pytest -q

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pc/package-lock.json

      - run: npm ci

      - name: Lint and format check
        run: npx @biomejs/biome check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        # Covers the client-side CAM maths (normalise, bilinear upscale,
        # colormaps) and manifest validation -- the same properties the Python
        # suite pins on the export side.
        run: npx vitest run

      - name: Build
        # The model is gitignored, so no artifact is present here. The app is
        # built to render a setup message rather than crash in that case, which
        # is exactly what this build exercises.
        run: npx next build

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
