# PlantGuard on one machine: the web app, MongoDB, and (for trying it out)
# Mailpit to catch account emails.
#
#   cp .env.example .env.production
#   # set BETTER_AUTH_SECRET and APP_URL; to try it out with Mailpit, also
#   # set SMTP_HOST=mailpit and SMTP_PORT=1025
#   docker compose up -d --build
#
# The app is on http://localhost:3000 and caught emails on
# http://localhost:8025. For a real deployment, point SMTP_* at your mail
# provider, remove the mailpit service, and put a TLS-terminating proxy in
# front of port 3000.

services:
  web:
    build: .
    env_file: .env.production
    environment:
      MONGODB_URI: mongodb://mongo:27017/plantguard
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    # A single-node replica set, so account changes can use transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  mongo-data:
