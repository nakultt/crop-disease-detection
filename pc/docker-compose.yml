# PlantGuard on one machine: the web app, MongoDB, and Mailpit to catch
# account emails (password resets, and verification if you turn it on).
#
#   docker compose up -d --build
#
# No configuration needed: the app is on http://localhost:3000 and caught
# emails on http://localhost:8025. To customise, create .env.production from
# .env.example; it is picked up automatically. For a public deployment set
# APP_URL and BETTER_AUTH_SECRET, point SMTP_* at your mail provider, and put
# a TLS-terminating proxy in front of port 3000.

services:
  web:
    build: .
    env_file:
      - path: .env.production
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/plantguard
      # Mailpit unless SMTP_HOST/SMTP_PORT are set in your shell or in a
      # `.env` file next to this one (compose reads those, not .env.production).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    volumes:
      - app-data:/app/.data
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    # A single-node replica set, so account changes can use transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  mongo-data:
  app-data:
